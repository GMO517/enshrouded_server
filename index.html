<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>霧鎖王國開服工具</title>
<style>
:root{--bg:#0d1420;--panel:#141d2d;--panel2:#1a2538;--line:#25324a;--tx:#e6edf7;--mu:#8b9bb4;--ac:#7cc4f0;--acd:#2b6a97;--ok:#5cc98a;--er:#ef6b61;--wa:#e8b85a}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:grid;grid-template-columns:176px 1fr;background:var(--bg);color:var(--tx);font:14px/1.5 "Microsoft JhengHei","Segoe UI",sans-serif}
nav{background:#0a101a;border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:4px}
nav h1{font-size:15px;margin:0 8px 14px;color:var(--ac)}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;color:var(--mu)}
nav button:hover{background:var(--panel)}nav button.on{background:var(--panel2);color:var(--tx);box-shadow:inset 3px 0 var(--ac)}
nav .st{margin-top:auto;padding:8px 12px;font-size:12px;color:var(--mu)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mu);margin-right:6px}
.dot.running{background:var(--ok)}.dot.starting,.dot.stopping{background:var(--wa)}
main{display:flex;flex-direction:column;min-width:0;height:100vh}
.pages{flex:1;overflow:auto;padding:20px 24px}
.page{display:none;max-width:760px}.page.on{display:block}
h2{font-size:17px;margin:0 0 14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
summary{cursor:pointer;color:var(--ac);font-size:14px;font-weight:bold;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";display:inline-block;width:1.2em;transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
details[open]>summary{margin-bottom:10px}
.card>h3{font-size:14px;margin:0 0 10px;color:var(--ac)}
button.b{font:inherit;border:0;border-radius:8px;padding:9px 18px;cursor:pointer;color:#fff;background:#34445f}
button.b:hover:not(:disabled){filter:brightness(1.15)}button.b:disabled{opacity:.4;cursor:default}
button.go{background:#2f9a5e}button.stop{background:#bd433a}button.pri{background:var(--acd)}
button.sm{padding:4px 10px;font-size:13px}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.big{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.big .s{font-size:18px;font-weight:bold;flex:1;min-width:140px}
.err{color:var(--er);white-space:pre-wrap}.okc{color:var(--ok)}.wac{color:var(--wa)}
ul{margin:0;padding-left:20px;min-height:24px}
#log{font:12px Consolas,monospace;height:220px;overflow:auto;background:#080d15;border-radius:6px;padding:8px;white-space:pre-wrap;color:#b8c6dc}
.row{display:grid;grid-template-columns:190px 1fr 56px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
h3+.row{border-top:0}
.row.w{grid-template-columns:190px 1fr auto}
.row label{cursor:help;text-decoration:underline dotted #567}.row .ctl{display:flex;gap:8px;align-items:center}
.row .ctl input[type=range]{flex:1;accent-color:var(--ac)}
input[type=text],input[type=number],select{background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit}
.ctl>input[type=text],.ctl>select{flex:1}input[type=number]{width:72px}
.u{font-size:12px;color:var(--mu)}
fieldset{border:0;padding:0;margin:0;min-width:0}fieldset:disabled{opacity:.45}
.g .head,.pwrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}.g .head input,.pwrow input{flex:1}.g .head input{font-weight:bold}
.perms{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}.perms label,.rs{cursor:help}
.rs{margin-top:8px;display:flex;gap:8px;align-items:center}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-top:1px solid var(--line)}th{color:var(--mu);font-weight:normal;border:0}
.add{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin-bottom:8px}
.empty{color:var(--mu);padding:4px 0}
#bar{display:none;align-items:center;gap:14px;padding:10px 24px;background:#0a101a;border-top:1px solid var(--line)}
#bar.on{display:flex}#bar .m{flex:1;white-space:pre-wrap;font-size:13px}
#tip{position:fixed;display:none;max-width:300px;background:#080d15;color:var(--tx);border:1px solid var(--ac);border-radius:6px;padding:7px 10px;font-size:13px;white-space:pre-wrap;z-index:99;pointer-events:none}
@media (prefers-reduced-motion:no-preference){button.b{transition:filter .15s}}
</style></head><body>
<nav>
 <h1>霧鎖王國開服</h1>
 <button data-p="console" class="on">控制台</button><button data-p="settings">伺服器設定</button><button data-p="groups">身分組</button><button data-p="bans">黑名單</button><button data-p="backup">地圖備份</button><button data-p="install">伺服器安裝</button>
 <div class="st"><span class="dot" id="dot"></span><span id="status">未啟動</span></div>
</nav>
<main>
<div class="pages">
 <section class="page on" id="p-console">
  <h2>控制台</h2>
  <div class="card big"><div class="s" id="status2">未啟動</div><button class="b go" id="start">一鍵開服</button><button class="b stop" id="stop" disabled>關閉伺服器</button></div>
  <details class="card"><summary data-tip="在遊戲的「搜尋 IPv4」輸入這些位址就能連到伺服器。Radmin / Tailscale 的位址要雙方都加入同一個虛擬網路才有用。朋友也可以在你進入伺服器後,從 Steam 好友清單加入你。">連線位址</summary>
   <div id="addrs"></div>
   <div class="row w"><label data-tip="用位址(本機以外)連進來時,伺服器這台電腦的 Windows 防火牆要放行 UDP 連接埠(預設 15637)。按鈕會要求系統管理員授權,並建立放行規則。">防火牆</label><div class="ctl"><span id="fwst">檢查中…</span></div><button class="b sm" id="fw" disabled>放行 UDP</button></div>
  </details>
  <div id="err" class="err"></div>
  <details class="card"><summary>在線成員 (<span id="n">0</span>)</summary><ul id="players"></ul></details>
  <div class="card"><h3>記錄</h3><div id="log"></div></div>
 </section>
 <section class="page" id="p-settings">
  <h2>伺服器設定</h2>
  <div class="card"><span class="u" id="dir"></span> <button class="b sm" id="reload">重新讀檔</button></div>
  <div id="runwarn" class="err"></div>
  <div id="form"></div>
 </section>
 <section class="page" id="p-groups"><h2>身分組</h2><div class="u" style="margin-bottom:10px">玩家輸入哪個密碼,就取得該身分組的權限。若全部都不想設密碼,需刪到只剩一個身分組(最多只能有一個不設密碼)。</div><div id="gcheck" style="margin-bottom:10px"></div><div id="groupsBox"></div><button class="b" id="addg">＋ 新增身分組</button></section>
 <section class="page" id="p-bans"><h2>黑名單</h2><div id="banBox"></div></section>
 <section class="page" id="p-backup"><h2>地圖備份</h2><div class="card"><button class="b pri" id="bk">備份目前地圖</button> <span class="u" id="bkmsg"></span><div class="u" style="margin-top:6px">備份放在伺服器資料夾的 world-backups。備份與還原都要先關閉伺服器;還原前會自動再備份一份目前的地圖。</div></div><div id="bkList"></div></section>
 <section class="page" id="p-install"><h2>伺服器安裝</h2>
  <div class="card"><h3>路徑</h3><div class="row"><label data-tip="請自行從 Valve 下載 SteamCMD 並解壓縮,這裡選到有 steamcmd.exe 的資料夾。">SteamCMD 資料夾</label><div class="ctl"><span class="u" id="scDir" style="flex:1;word-break:break-all"></span></div><button class="b sm" id="chooseSc">選擇</button></div>
  <div class="row"><label data-tip="遊戲伺服器要安裝(或已安裝)的資料夾,存檔與設定檔都在這裡。更新前請先關閉伺服器。">遊戲伺服器資料夾</label><div class="ctl"><span class="u" id="svDir" style="flex:1;word-break:break-all"></span></div><button class="b sm" id="choose">選擇</button></div>
  </div>
  <div class="card"><h3>安裝與更新</h3><button class="b pri" id="inst">安裝伺服器</button> <button class="b pri" id="upd">更新伺服器</button> <span class="u" id="instmsg"></span></div></section>
</div>
<div id="bar"><div class="m" id="msg"></div><button class="b pri" id="save">儲存設定</button></div>
</main>
<div id="tip"></div>
<script>
const $=id=>document.getElementById(id);
const L={stopped:'未啟動',starting:'啟動中…',running:'執行中',stopping:'關閉中(存檔中,請稍候)…'};
let installing=false,curState='stopped',cfg=null,snap='',dirty=false,groupErrs=[];

function show(p){
  document.querySelectorAll('.page').forEach(e=>e.classList.toggle('on',e.id==='p-'+p));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  $('bar').classList.toggle('on',p==='settings'||p==='groups'||p==='bans');
  if(p==='backup')renderBackups();if(p==='install')refreshPaths();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.p));

function el(tag,props){return Object.assign(document.createElement(tag),props||{})}
function setState(s){
  curState=s;
  $('status').textContent=$('status2').textContent=L[s];
  $('dot').className='dot '+s;
  $('start').disabled=s!=='stopped'||installing;
  $('stop').disabled=!(s==='running'||s==='starting');
  if(s==='stopped'&&!dirty)loadCfg(); // 關服時伺服器可能改過設定檔,沒有未存修改就重新讀
  applyLock();refreshPaths();
}
function setPlayers(p){
  $('n').textContent=p.length;
  $('players').innerHTML='';
  if(!p.length)return $('players').appendChild(el('li',{className:'u',textContent:'目前沒有人在線'}));
  p.forEach(n=>$('players').appendChild(el('li',{textContent:n})));
}
$('start').onclick=()=>{$('err').textContent='';api.start()};
$('stop').onclick=()=>{if(confirm('確定要關閉伺服器嗎?在線的玩家會被中斷,關閉時會先存檔。'))api.stop()};
api.on('state',setState);api.on('players',setPlayers);
api.on('error',m=>$('err').textContent=m);
api.on('log',l=>{const d=$('log');d.textContent+=l+'\n';if(d.textContent.length>20000)d.textContent=d.textContent.slice(-10000);d.scrollTop=d.scrollHeight});

// hover 說明(自製浮動提示,因為原生 title 在此視窗不顯示)
(()=>{
  const tip=$('tip');
  const place=e=>{const w=tip.offsetWidth,h=tip.offsetHeight;
    tip.style.left=Math.max(4,Math.min(e.clientX+14,innerWidth-w-8))+'px';
    tip.style.top=(e.clientY+h+24>innerHeight?e.clientY-h-10:e.clientY+18)+'px'};
  document.addEventListener('mouseover',e=>{
    const t=e.target.closest&&e.target.closest('[data-tip]');
    if(t&&t.dataset.tip){tip.textContent=t.dataset.tip;tip.style.display='block';place(e)}
  });
  document.addEventListener('mousemove',e=>{if(tip.style.display==='block')place(e)});
  document.addEventListener('mouseout',e=>{
    const t=e.target.closest&&e.target.closest('[data-tip]');
    if(t&&!(e.relatedTarget&&t.contains(e.relatedTarget)))tip.style.display='none';
  });
})();

// ---------- 設定 ----------
// 數值範圍與說明依據伺服器資料夾內的官方 enshrouded_server_readme.txt
const NS_MIN=6e10; // 奈秒/分鐘
// f: 倍率滑桿 [min,max];m: 分鐘滑桿 [min,max];o: 選項 [[值,中文,說明]];b: 開關
const META={

 randomSpawnerAmount:{zh:'敵人數量',o:[['Few','少',''],['Normal','普通(預設)',''],['Automatic','自動',''],['Many','多',''],['Extreme','極多','']],d:'世界裡的敵人有多少。'},
 aggroPoolAmount:{zh:'同時攻擊的敵人數',o:[['Few','少',''],['Normal','普通(預設)',''],['Many','多',''],['Extreme','極多','']],d:'同時能有多少敵人圍攻你,越多越難。'},

 flameLevelFogRemoval:{zh:'迷霧建祭壇所需火焰等級',n:[0,20],d:'越高,要更高的火焰等級才能在迷霧裡建火焰祭壇。'}

const PRESETS=[['Default','預設','和遊戲原本設定相同。'],['Relaxed','輕鬆','敵人少、資源多,適合蓋房子。'],['Hard','困難','敵人更多更兇。'],['Survival','生存','敵人更兇,另有飢餓等生存機制。'],['Custom','自訂','自己調整下面的數值(只有選這個,下面的數值才會生效)。']];
const CATS=[
 ['玩家',['playerHealthFactor','playerManaFactor','playerStaminaFactor','tombstoneMode','enableDurability','enableGliderTurbulences']],
 ['生存與環境',['playerBodyHeatFactor','playerDivingTimeFactor','enableStarvingDebuff','foodBuffDurationFactor','fromHungerToStarving','shroudTimeFactor','weatherFrequency','curseModifier']],
 ['敵人與頭目',['randomSpawnerAmount','aggroPoolAmount','enemyDamageFactor','enemyHealthFactor','enemyStaminaFactor','enemyPerceptionRangeFactor','bossDamageFactor','bossHealthFactor','threatBonus','pacifyAllEnemies','tamingStartleRepercussion']],
 ['經驗與資源',['miningDamageFactor','resourceDropStackAmountFactor','perkUpgradeRecyclingFactor','perkCostFactor','experienceCombatFactor','experienceMiningFactor','experienceExplorationQuestsFactor']],
 ['世界',['dayTimeDuration','nightTimeDuration','fishingDifficulty','plantGrowthSpeedFactor','factoryProductionSpeedFactor','flameLevelFogRemoval']]
];

function item(label,controls,unit,desc){
  const r=el('div',{className:'row'});
  const lab=el('label',{textContent:label});lab.dataset.tip=desc||'';
  const c=el('div',{className:'ctl'});controls.forEach(x=>c.appendChild(x));
  r.append(lab,c,el('span',{className:'u',textContent:unit||''}));
  return r;
}
function slider(min,max,step,value,onChange){
  max=Math.max(max,value);min=Math.min(min,value);
  const s=el('input',{type:'range',min,max,step,value});
  const n=el('input',{type:'number',min,step,value});
  s.oninput=()=>{n.value=s.value;onChange(+s.value)};
  n.oninput=()=>{if(n.value==='')return;s.max=Math.max(+s.max,+n.value);s.value=n.value;onChange(+n.value)};
  return [s,n];
}
function selectItem(label,opts,value,desc,onChange){
  if(!opts.some(o=>o[0]===value))opts=opts.concat([[value,value,'']]);
  const s=el('select');
  opts.forEach(o=>s.appendChild(el('option',{value:o[0],textContent:o[1],selected:o[0]===value})));
  const w=item(label,[s],'',desc);
  const lab=w.querySelector('label');
  const upd=()=>{const o=opts.find(x=>x[0]===s.value);lab.dataset.tip=(desc||'')+(o&&o[2]?'\n'+o[1]+':'+o[2]:'')};
  s.onchange=()=>{onChange(s.value);upd()};upd();
  return w;
}
function checkbox(value,onChange){const i=el('input',{type:'checkbox',checked:value});i.onchange=()=>onChange(i.checked);return i}
function card(title){const c=el('div',{className:'card'});c.appendChild(el('h3',{textContent:title}));return c}

let gsBox;
function buildForm(){
  const f=$('form');f.innerHTML='';
  const c=cfg;
  let b=card('基本');
  const nm=el('input',{type:'text',value:c.name});nm.oninput=()=>c.name=nm.value;
  b.appendChild(item('伺服器名稱',[nm],'','玩家在遊戲的「加入遊戲」清單中搜尋用的名稱。'));
  b.appendChild(item('最大人數',slider(1,16,1,c.slotCount,v=>c.slotCount=v),'人','同時在線人數上限(1~16)。'));
  if('voiceChatMode' in c)b.appendChild(selectItem('語音聊天範圍',[['Proximity','附近(靠近才聽得到)',''],['Global','全服(所有人都聽得到)','']],c.voiceChatMode,'需先開啟語音聊天。',v=>c.voiceChatMode=v));
  if('enableVoiceChat' in c)b.appendChild(item('語音聊天',[checkbox(c.enableVoiceChat,v=>c.enableVoiceChat=v)],'','開啟=玩家可用遊戲內語音。'));
  if('enableTextChat' in c)b.appendChild(item('文字聊天',[checkbox(c.enableTextChat,v=>c.enableTextChat=v)],'','開啟=玩家可用遊戲內文字聊天。'));
  f.appendChild(b);

  b=card('難度');
  b.appendChild(selectItem('難度預設',PRESETS,c.gameSettingsPreset,'只有選「自訂」,下面各項才會生效。',v=>{c.gameSettingsPreset=v;lockGS()}));
  f.appendChild(b);

  gsBox=el('fieldset');
  const gs=c.gameSettings,used=new Set(CATS.flatMap(x=>x[1]));
  const build=k=>{
    const v=gs[k],m=META[k]||{zh:k};
    if(typeof v==='boolean')return item(m.zh,[checkbox(v,x=>gs[k]=x)],'',m.d);
    if(m.o)return selectItem(m.zh,m.o,v,m.d,x=>gs[k]=x);
    if(typeof v==='number'&&m.m)return item(m.zh,slider(m.m[0],m.m[1],1,v/NS_MIN,x=>gs[k]=Math.round(x*NS_MIN)),'分鐘',m.d);
    if(typeof v==='number'&&m.f)return item(m.zh,slider(m.f[0],m.f[1],0.05,v,x=>gs[k]=Math.round(x*100)/100),'倍',m.d);
    if(typeof v==='number'){const [a,z]=m.n||[0,100];return item(m.zh,slider(a,z,1,v,x=>gs[k]=x),'',m.d)}
    const i=el('input',{type:'text',value:v});i.oninput=()=>gs[k]=i.value;
    return item(m.zh,[i],'',m.d);
  };
  CATS.forEach(([title,keys])=>{
    const cd=card(title);
    keys.filter(k=>k in gs).forEach(k=>cd.appendChild(build(k)));
    if(title==='世界')Object.keys(gs).filter(k=>!used.has(k)).forEach(k=>cd.appendChild(build(k)));
    gsBox.appendChild(cd);
  });
  f.appendChild(gsBox);lockGS();
}
const PERMS=[['canKickBan','踢人 / 封鎖玩家','可以踢出或永久封鎖其他玩家,建議只給管理員。'],['canAccessInventories','開箱子與容器','可以開基地裡的箱子、工作站等容器(野外寶箱不受影響)。'],['canEditWorld','改野外地形','可以挖掘、破壞野外地形。不想被亂挖就不要勾。'],['canEditBase','基地建造與拆除','可以在基地內建造、拆除、改地形與放水。'],['canExtendBase','火焰祭壇管理','可以新增、拆除、升級火焰祭壇(擴大基地)。']];
function randPw(){const a='abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';crypto.getRandomValues(new Uint32Array(12)).forEach(x=>s+=a[x%a.length]);return s}
function renderGroups(){
  const box=$('groupsBox');box.innerHTML='';
  cfg.userGroups.forEach((g,idx)=>{
    const c=el('div',{className:'card g'});
    const head=el('div',{className:'head'});
    const nm=el('input',{type:'text',value:g.name,placeholder:'身分組名稱'});nm.oninput=()=>{g.name=nm.value;checkGroups()};
    const del=el('button',{className:'b sm stop',textContent:'刪除'});
    del.onclick=()=>{cfg.userGroups.splice(idx,1);renderGroups();touch()};
    head.append(nm,del);c.appendChild(head);

    const pr=el('div',{className:'pwrow'});
    const pl=el('label',{textContent:'密碼'});pl.dataset.tip='玩家加入時輸入這個密碼,就會取得此身分組的權限。留空=不用密碼(全部身分組中最多一個)。';
    const pw=el('input',{type:'text',value:g.password||'',placeholder:'留空=不需要密碼'});pw.oninput=()=>{g.password=pw.value;checkGroups()};
    const dice=el('button',{className:'b sm',textContent:'隨機'});dice.onclick=()=>{pw.value=randPw();g.password=pw.value;checkGroups();touch()};
    pr.append(pl,pw,dice);c.appendChild(pr);

    const pm=el('div',{className:'perms'});
    PERMS.forEach(([k,zh,tip])=>{
      const lab=el('label');lab.dataset.tip=tip;
      const cb=el('input',{type:'checkbox',checked:!!g[k]});cb.onchange=()=>{g[k]=cb.checked;checkGroups()};
      lab.append(cb,document.createTextNode(' '+zh));pm.appendChild(lab);
    });
    c.appendChild(pm);

    const rs=el('label',{className:'rs'});rs.dataset.tip='替這個身分組預留的名額。人數滿時,其他身分組會被擋在外面,這個身分組仍進得來。';
    rs.appendChild(document.createTextNode('保留名額'));
    const ri=el('input',{type:'number',min:0,max:16,value:g.reservedSlots||0});ri.oninput=()=>{g.reservedSlots=Math.max(0,+ri.value||0)};
    rs.appendChild(ri);c.appendChild(rs);
    box.appendChild(c);
  });
  checkGroups();
}
$('addg').onclick=()=>{
  if(!cfg)return;
  let n=1;while(cfg.userGroups.some(g=>g.name==='新身分組'+n))n++;
  cfg.userGroups.push({name:'新身分組'+n,password:randPw(),canKickBan:false,canAccessInventories:false,canEditWorld:false,canEditBase:false,canExtendBase:false,reservedSlots:0});
  renderGroups();touch();
};
function checkGroups(){
  const g=cfg.userGroups,errs=[],warns=[];
  if(!g.length)errs.push('至少要有一個身分組');
  const names=g.map(x=>(x.name||'').trim());
  if(names.some(n=>!n))errs.push('身分組名稱不能空白');
  if(new Set(names).size!==names.length)errs.push('身分組名稱不能重複');
  const pws=g.map(x=>x.password||'').filter(Boolean);
  if(new Set(pws).size!==pws.length)errs.push('密碼不能重複(每個身分組要不同密碼)');
  if(g.length-pws.length>1)errs.push('最多只能有一個身分組不設密碼');
  const open=g.find(x=>!x.password);
  if(open)g.filter(x=>x.password).forEach(p=>{
    if(PERMS.some(([k])=>open[k]&&!p[k]))warns.push('「'+open.name+'」沒有密碼,卻有比「'+p.name+'」更多的權限,伺服器可能拒絕啟動');
  });
  const gc=$('gcheck');gc.innerHTML='';
  errs.forEach(x=>gc.appendChild(el('div',{className:'err',textContent:'✖ '+x})));
  warns.forEach(x=>gc.appendChild(el('div',{className:'wac',textContent:'⚠ '+x})));
  if(!errs.length&&!warns.length)gc.appendChild(el('div',{className:'okc',textContent:'✔ 身分組設定沒問題'}));
  groupErrs=errs;applyLock();
}

// ---------- 黑名單 ----------
function renderBans(){
  const box=$('banBox');box.innerHTML='';
  const list=cfg.bannedAccounts||[];
  const c=card('已封鎖 ('+list.length+')');
  if(!list.length)c.appendChild(el('div',{className:'empty',textContent:'目前沒有封鎖任何人。有「踢人 / 封鎖」權限的玩家封鎖人後,會出現在這裡。'}));
  else{
    const t=el('table');t.innerHTML='<tr><th>名稱</th><th>角色名</th><th>封鎖日期</th><th>帳號雜湊</th><th></th></tr>';
    list.forEach((b,i)=>{
      const tr=el('tr');
      const h=String(b.accountIDHash||'');
      [b.displayName||'—',b.characterName||'—',b.banDate?new Date(b.banDate*1000).toLocaleDateString('zh-TW'):'—',h.length>14?h.slice(0,8)+'…'+h.slice(-4):h].forEach((x,j)=>{
        const td=el('td',{textContent:x});if(j===3){td.dataset.tip=h;td.style.fontFamily='Consolas,monospace'}tr.appendChild(td)});
      const td=el('td');const u=el('button',{className:'b sm',textContent:'解除封鎖'});
      u.onclick=()=>{list.splice(i,1);renderBans();touch()};td.appendChild(u);tr.appendChild(td);t.appendChild(tr);
    });
    c.appendChild(t);
  }
  box.appendChild(c);
  const a=card('手動新增');
  const f=el('div',{className:'add'});
  const hs=el('input',{type:'text',placeholder:'帳號雜湊(必填)'}),dn=el('input',{type:'text',placeholder:'顯示名稱'}),cn=el('input',{type:'text',placeholder:'角色名'});
  const ad=el('button',{className:'b pri',textContent:'新增封鎖'});
  const warn=el('div',{className:'err'});
  ad.onclick=()=>{
    const h=hs.value.trim();
    if(!h){warn.textContent='帳號雜湊不能空白';return}
    if(list.some(x=>x.accountIDHash===h)){warn.textContent='這個雜湊已在黑名單中';return}
    if(!cfg.bannedAccounts)cfg.bannedAccounts=list;
    list.push({accountIDHash:h,displayName:dn.value.trim(),characterName:cn.value.trim(),banDate:Math.floor(Date.now()/1000)});
    renderBans();touch();
  };
  f.append(hs,dn,cn,ad);a.append(f,warn,el('div',{className:'u',textContent:'手動新增的項目伺服器是否接受尚未驗證,存檔後請開服確認。'}));
  box.appendChild(a);
}

// ---------- 讀檔 / 存檔 ----------
function lockGS(){if(gsBox)gsBox.disabled=cfg.gameSettingsPreset!=='Custom'}
function touch(){dirty=!!cfg&&JSON.stringify(cfg)!==snap;applyLock()}
document.addEventListener('input',()=>setTimeout(touch));
document.addEventListener('change',()=>setTimeout(touch));
let note=false; // msg 目前是否顯示儲存/錯誤結果
function applyLock(){
  const running=curState!=='stopped';
  $('save').disabled=running||!cfg||!dirty||groupErrs.length>0;
  $('choose').disabled=running;
  $('runwarn').textContent=running?'伺服器執行中,設定無法儲存。請先關閉伺服器。':'';
  if(!note){$('msg').className='m';$('msg').textContent=dirty?'有尚未儲存的修改':''}
}
function say(text,cls){note=!!text;$('msg').className='m '+(cls||'');$('msg').textContent=text}
async function loadCfg(){
  const r=await api.getConfig();
  $('dir').textContent='伺服器資料夾:'+r.dir;
  if(!r.ok){cfg=null;snap='';dirty=false;$('form').innerHTML='';say(r.error,'err');applyLock();return}
  cfg=r.config;snap=JSON.stringify(cfg);dirty=false;say('');
  buildForm();renderGroups();renderBans();applyLock();
}
$('reload').onclick=()=>{
  if(dirty&&!confirm('有尚未儲存的修改,重新讀檔會全部丟掉。繼續嗎?'))return;
  loadCfg();
};
$('choose').onclick=async()=>{
  if(dirty&&!confirm('有尚未儲存的修改,更換資料夾會全部丟掉。繼續嗎?'))return;
  const r=await api.chooseDir();
  if(r.error)say(r.error,'err');
  if(r.ok)loadCfg();
  refreshPaths();
};
document.addEventListener('input',()=>{if(note&&dirty)say('')},true);
$('save').onclick=async()=>{
  let r=await api.saveConfig({config:cfg});
  if(r.conflict){
    if(!confirm('設定檔在你載入之後被其他程式修改過。要用目前畫面的內容覆蓋嗎?(舊檔會先備份)'))return;
    r=await api.saveConfig({config:cfg,force:true});
  }
  if(!r.ok){say(r.errors.join('\n'),'err');return}
  snap=JSON.stringify(cfg);dirty=false;
  const w=r.warnings&&r.warnings.length;
  say('已儲存,舊設定備份在伺服器資料夾的 config-backups'+(w?'\n警告:'+r.warnings.join('\n警告:'):''),w?'wac':'okc');
  applyLock();
};


// ---------- 安裝 / 更新 ----------
let installed=false;
async function refreshPaths(){
  const p=await api.getPaths();
  installed=p.installed;installing=p.installing;
  $('scDir').textContent=p.steamcmd||'(尚未選擇)';$('svDir').textContent=p.server;
  const idle=curState==='stopped'&&!installing;
  $('inst').disabled=!idle||installed||!p.steamcmd;$('upd').disabled=!idle||!installed||!p.steamcmd;
  $('chooseSc').disabled=$('choose').disabled=!idle;
  $('start').disabled=!idle;
  $('instmsg').textContent=installing?'安裝/更新中,請稍候…':installed?'已安裝':'尚未安裝';
}
$('chooseSc').onclick=async()=>{const r=await api.chooseSteamcmd();if(r.error)$('instmsg').textContent=r.error;refreshPaths()};
const runInstall=async()=>{
  $('err').textContent='';
  const r=await api.installServer();
  if(!r.ok){$('instmsg').textContent=r.error;return}
  refreshPaths();show('console');
};
$('inst').onclick=$('upd').onclick=runInstall;
api.on('installing',on=>{installing=on;refreshPaths();if(!on&&!dirty)loadCfg()});

// ---------- 地圖備份 ----------
const fmtSize=b=>b>=1e9?(b/1e9).toFixed(2)+' GB':(b/1e6).toFixed(1)+' MB';
async function renderBackups(){
  const r=await api.backupList(),box=$('bkList');box.innerHTML='';
  const c=card('已儲存的備份 ('+r.items.length+')');
  if(!r.items.length)c.appendChild(el('div',{className:'empty',textContent:'還沒有備份。按上面的「備份目前地圖」建立第一份。'}));
  else{
    const t=el('table');t.innerHTML='<tr><th>名稱</th><th>時間</th><th>大小</th><th></th></tr>';
    r.items.forEach(i=>{
      const tr=el('tr');
      [i.name,new Date(i.time).toLocaleString('zh-TW',{hour12:false}),fmtSize(i.size)].forEach(x=>tr.appendChild(el('td',{textContent:x})));
      const td=el('td');
      const rs=el('button',{className:'b sm',textContent:'還原'}),dl=el('button',{className:'b sm stop',textContent:'刪除'});
      rs.onclick=()=>act(()=>confirm('要用「'+i.name+'」覆蓋目前的地圖嗎?\n(會先自動備份一份目前的地圖)')&&api.backupRestore(i.name),'已還原');
      dl.onclick=()=>act(()=>confirm('要刪除備份「'+i.name+'」嗎?刪除後無法復原。')&&api.backupDelete(i.name),'已刪除');
      td.append(rs,' ',dl);tr.appendChild(td);t.appendChild(tr);
    });
    c.appendChild(t);
  }
  box.appendChild(c);
}
async function act(fn,okText){
  const r=await fn();if(!r)return;
  $('bkmsg').className='u '+(r.ok?'okc':'err');$('bkmsg').textContent=r.ok?okText:r.error;
  renderBackups();
}
$('bk').onclick=()=>act(()=>api.backupCreate(),'已備份');

// ---------- 連線資訊 ----------
async function refreshNet(){
  const box=$('addrs');box.innerHTML='';
  (await api.getNet()).forEach(n=>{
    const r=el('div',{className:'row w'}),b=el('button',{className:'b sm',textContent:'複製'});
    b.onclick=()=>{navigator.clipboard.writeText(n.addr);b.textContent='已複製';setTimeout(()=>b.textContent='複製',1500)};
    r.append(el('label',{textContent:n.label,style:'cursor:default;text-decoration:none'}),el('div',{className:'ctl',innerHTML:''}),b);
    r.children[1].appendChild(el('b',{textContent:n.addr}));
    box.appendChild(r);
  });
}
function setFw(ok){$('fwst').textContent=ok?'已放行':'未放行';$('fwst').className=ok?'okc':'wac';$('fw').disabled=ok}
$('fw').onclick=async()=>{
  $('fw').disabled=true;$('fwst').className='';$('fwst').textContent='等待系統管理員授權…';
  setFw((await api.addFirewall()).ok);
};

api.getState().then(s=>{setState(s.state);setPlayers(s.players)});
loadCfg();refreshPaths();renderBackups();refreshNet();api.checkFirewall().then(setFw);
</script></body></html>
